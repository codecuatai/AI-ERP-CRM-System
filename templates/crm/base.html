<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI CRM{% endblock %}</title>
  <style>
    :root { font-family: Inter, Segoe UI, sans-serif; color: #172033; background: #f4f6fa; }
    body { margin: 0; } header { background: #172554; color: white; padding: 18px max(24px, calc((100% - 1080px)/2)); }
    header a { color: white; text-decoration: none; font-weight: 700; } main { max-width: 1080px; margin: 32px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 16px; }
    .card { background: white; border: 1px solid #e4e8f0; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .muted { color: #64748b; } table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
    th,td { padding: 13px 16px; border-bottom: 1px solid #edf0f5; text-align: left; } th { color: #64748b; font-size: 13px; }
    a.link { color: #1d4ed8; text-decoration: none; } button { background: #2563eb; color: white; border: 0; border-radius: 8px; padding: 10px 15px; cursor: pointer; }
    .message { background: #e0f2fe; border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
    @media(max-width:600px) { main { margin-top: 20px; padding: 0 12px; } th,td { padding: 10px 8px; } }
  </style>
</head>
<body>
  <header><a href="{% url 'crm:dashboard' %}">AI CRM</a><span style="float:right">{{ request.user.get_username }} · <a href="/admin/">Wagtail Admin</a></span></header>
  <main>
    {% if messages %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
