name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-e2e.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install browser E2E dependency
        if: matrix.python-version == '3.12'
        run: pip install -r requirements-e2e.txt && playwright install --with-deps chromium

      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip install pip-audit && pip-audit -r requirements-e2e.txt

      - name: Create development environment file
        run: cp .env.example .env

      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check

      - name: Run backend tests
        run: python manage.py test --verbosity=2

      - name: Run browser end-to-end tests
        if: matrix.python-version == '3.12'
        run: python manage.py test crm.test_browser_e2e --verbosity=2
        env:
          RUN_BROWSER_E2E: '1'

  frontend:
    name: Frontend · Tailwind build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tailwind/package-lock.json

      - name: Install frontend dependencies
        working-directory: tailwind
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: tailwind
        run: npm audit --audit-level=high

      - name: Build CSS
        working-directory: tailwind
        run: npm run css:build
