name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-e2e.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install browser E2E dependency
        if: matrix.python-version == '3.12'
        run: pip install -r requirements-e2e.txt && playwright install --with-deps chromium

      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip install pip-audit && pip-audit -r requirements-e2e.txt

      - name: Create development environment file
        run: cp .env.example .env

      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check

      - name: Run backend tests
        run: python manage.py test --verbosity=2

      - name: Run browser end-to-end tests
        if: matrix.python-version == '3.12'
        run: python manage.py test crm.test_browser_e2e --verbosity=2
        env:
          RUN_BROWSER_E2E: '1'

  frontend:
    name: Frontend · Tailwind build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tailwind/package-lock.json

      - name: Install frontend dependencies
        working-directory: tailwind
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: tailwind
        run: npm audit --audit-level=critical

      - name: Build CSS
        working-directory: tailwind
        run: npm run css:build

  analytics-postgresql:
    name: Analytics · PostgreSQL and reader permissions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm_app
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm_app -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DATABASE_URL: postgresql://crm_app:isolated-ci-password@127.0.0.1:5432/crm
      SUPERSET_READONLY_PASSWORD: isolated-reader-password
      PGPASSWORD: isolated-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create isolated analytics reader
        run: psql -h 127.0.0.1 -U crm_app -d crm -c "CREATE ROLE superset_ro LOGIN PASSWORD 'isolated-reader-password'"
      - name: Test analytics and consent with PostgreSQL
        run: python manage.py test crm.test_ai_analytics crm.test_quality_regressions --verbosity=2
